name: Build Executables (Windows & Linux)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: Markdown2PDF-windows.exe
            binary_path: dist/Markdown2PDF-windows.exe
            output_name: Markdown2PDF-windows
          - os: ubuntu-latest
            artifact_name: Markdown2PDF-linux
            binary_path: dist/Markdown2PDF-linux
            output_name: Markdown2PDF-linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Linux Tkinter and font system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk fonts-noto-core fonts-noto-color-emoji

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ".[build,dev]"

      - name: Run automated test suite
        run: |
          pytest tests/test_converter.py -v

      - name: Build standalone executable with PyInstaller
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name ${{ matrix.output_name }} --collect-submodules markdown app.py

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.binary_path }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish to GitHub Release on Tag
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
